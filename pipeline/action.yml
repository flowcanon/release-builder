name: Release pipeline
description: >
  Runs the full release pipeline as sequential steps in a single job:
  checkout → detect_release → build_changelog → package_version → pull_request.
  Eliminates race conditions between tag detection and changelog building.

inputs:
  version-command:
    description: >
      Override for version detection (e.g., `poetry version --short`).
      Auto-detects from VERSION/package.json/pyproject.toml if empty.
    default: ""
  force-pr:
    description: Force pull request creation even if no PRs are found
    default: "false"

outputs:
  created-tag:
    description: The tag if one was created (truthy means a release shipped)
    value: ${{ steps.tag.outputs.tag }}
  current-version:
    description: The current version from detect_release
    value: ${{ steps.tag.outputs.current-version }}

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ github.head_ref || github.ref_name }}
        fetch-depth: 0

    - id: version-command
      env:
        CUSTOM_CMD: ${{ inputs.version-command }}
      run: |
        if [ -n "$CUSTOM_CMD" ]; then
          printf 'cmd=%s\n' "$CUSTOM_CMD" >> "$GITHUB_OUTPUT"
        elif [ -f package.json ]; then
          echo "cmd=node -p \"require('./package.json').version\"" >> "$GITHUB_OUTPUT"
        elif [ -f pyproject.toml ]; then
          echo "cmd=grep -Po '(?<=^version = \")([^\"]+)' pyproject.toml" >> "$GITHUB_OUTPUT"
        elif [ -f VERSION ]; then
          echo "cmd=cat VERSION" >> "$GITHUB_OUTPUT"
        else
          echo "::error::No version source found. Set version-command input or add VERSION/package.json/pyproject.toml."
          exit 1
        fi
      shell: bash

    - id: tag
      env:
        VERSION_CMD: ${{ steps.version-command.outputs.cmd }}
      run: |
        current_version=$(eval "$VERSION_CMD")
        printf 'current-version=%s\n' "$current_version" >> "$GITHUB_OUTPUT"
        tag="v${current_version}"
        if git rev-parse "$tag" >/dev/null 2>&1; then
          echo "Tag $tag already exists; skipping tag creation"
          exit 0
        fi
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git tag -a "$tag" -m "chore(release): ${current_version}"
        git push origin "$tag"
        printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      shell: bash

    - if: "!steps.tag.outputs.tag"
      env:
        CURRENT_VERSION: ${{ steps.tag.outputs.current-version }}
      run: |
        latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n1)
        latest_version="${latest_tag#v}"
        if [ -n "$latest_version" ] && [ "$CURRENT_VERSION" != "$latest_version" ]; then
          echo "::error::Version ${CURRENT_VERSION} ≠ latest tag ${latest_tag}. A release commit exists but was not tagged."
          exit 1
        fi
      shell: bash

    - id: changelog
      if: "!steps.tag.outputs.tag"
      uses: flowcanon/release-builder/build-changelog@v3

    - if: steps.changelog.outputs.has-prs || inputs.force-pr == 'true'
      uses: flowcanon/release-builder/package-version@v3
      with:
        version: ${{ steps.changelog.outputs.next-version }}

    - if: steps.changelog.outputs.has-prs || inputs.force-pr == 'true'
      uses: flowcanon/release-builder/pull-request@v3
      with:
        next-version: ${{ steps.changelog.outputs.next-version }}
        notes: ${{ steps.changelog.outputs.notes }}
        previous-version: ${{ steps.changelog.outputs.previous-version }}
        release: ${{ steps.changelog.outputs.release }}
