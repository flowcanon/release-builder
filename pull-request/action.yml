name: Create pull request
description: Creates a release pull request with an updated CHANGELOG.md file.

inputs:
  next-version:
    description: The version being released
    required: true
  notes:
    description: The changelog notes for this release in markdown
    required: true
  previous-version:
    description: The previous release tag
    required: true
  release:
    description: "The release type: major, minor, or patch"
    required: true

runs:
  using: "composite"
  steps:
    - id: guard
      run: |
        git fetch --tags --force
        if git rev-parse "v${{ inputs.next-version }}" >/dev/null 2>&1; then
          echo "::warning::Tag v${{ inputs.next-version }} already exists — skipping PR creation"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        previous_version="${{ inputs.previous-version }}"
        if [[ "$previous_version" == v* ]]; then
          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          if [ -n "$latest_tag" ] && [ "$latest_tag" != "$previous_version" ]; then
            echo "::warning::Latest tag is $latest_tag, expected $previous_version — skipping stale PR creation"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"
      shell: bash

    - if: steps.guard.outputs.skip != 'true'
      run: |
        echo -e "# Changelog\n" > NEXT.md
        echo -e "${{ inputs.release == 'patch' && '###' || '##' }} [${{ inputs.next-version }}](${{ github.server_url }}/${{ github.repository }}/compare/${{ inputs.previous-version }}...v${{ inputs.next-version }}) ($(date +'%Y-%m-%d'))\n" >> NEXT.md
        echo -e "${{ inputs.notes }}\n" >> NEXT.md
        if [ -f CHANGELOG.md ]; then
          cat CHANGELOG.md | sed -e '1,1d' >> NEXT.md
        else
          echo -e "---\n" >> NEXT.md
          echo -e "*Changelog introduced after ${{ inputs.previous-version }}*\n" >> NEXT.md
        fi
        mv NEXT.md CHANGELOG.md
      shell: bash

    - id: commit
      if: steps.guard.outputs.skip != 'true'
      uses: pr-mpt/actions-commit-hash@v4

    - if: steps.guard.outputs.skip != 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        title: Release ${{ inputs.next-version }}
        body: |
          ## Release [${{ inputs.next-version }}](${{ github.server_url }}/${{ github.repository }}/compare/${{ inputs.previous-version }}...${{ steps.commit.outputs.short }})

          ${{ inputs.notes }}
        author: GitHub <noreply@github.com>
        base: ${{ github.head_ref || github.ref_name }}
        branch: release
        committer: GitHub <noreply@github.com>
        commit-message: |
          chore(release): ${{ inputs.next-version }}
        delete-branch: true
