name: Create pull request
description: Creates a release pull request with an updated CHANGELOG.md file.

inputs:
  next-version:
    description: The version being released
    required: true
  notes:
    description: The changelog notes for this release in markdown
    required: true
  previous-version:
    description: The previous release tag
    required: true
  release:
    description: "The release type: major, minor, or patch"
    required: true

runs:
  using: "composite"
  steps:
    - id: guard
      env:
        NEXT_VERSION: ${{ inputs.next-version }}
        PREVIOUS_VERSION: ${{ inputs.previous-version }}
      run: |
        git fetch --tags --force
        if git rev-parse "v${NEXT_VERSION}" >/dev/null 2>&1; then
          echo "::warning::Tag v${NEXT_VERSION} already exists — skipping PR creation"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ "$PREVIOUS_VERSION" == v* ]]; then
          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          if [ -n "$latest_tag" ] && [ "$latest_tag" != "$PREVIOUS_VERSION" ]; then
            echo "::warning::Latest tag is $latest_tag, expected $PREVIOUS_VERSION — skipping stale PR creation"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"
      shell: bash

    - if: steps.guard.outputs.skip != 'true'
      env:
        NEXT_VERSION: ${{ inputs.next-version }}
        PREVIOUS_VERSION: ${{ inputs.previous-version }}
        NOTES: ${{ inputs.notes }}
        HEADING_PREFIX: ${{ inputs.release == 'patch' && '###' || '##' }}
        COMPARE_URL: ${{ github.server_url }}/${{ github.repository }}/compare/${{ inputs.previous-version }}...v${{ inputs.next-version }}
      run: |
        today=$(date +'%Y-%m-%d')
        {
          printf '# Changelog\n\n'
          printf '%s [%s](%s) (%s)\n\n' "$HEADING_PREFIX" "$NEXT_VERSION" "$COMPARE_URL" "$today"
          printf '%s\n\n' "$NOTES"
          if [ -f CHANGELOG.md ]; then
            sed -e '1,1d' CHANGELOG.md
          else
            printf -- '---\n\n'
            printf '*Changelog introduced after %s*\n\n' "$PREVIOUS_VERSION"
          fi
        } > NEXT.md
        mv NEXT.md CHANGELOG.md
      shell: bash

    - id: commit
      if: steps.guard.outputs.skip != 'true'
      uses: pr-mpt/actions-commit-hash@ab7ed4c8afc25f58dc481d8b03b5982584909cdf # v4.0.0

    - if: steps.guard.outputs.skip != 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        title: Release ${{ inputs.next-version }}
        body: |
          ## Release [${{ inputs.next-version }}](${{ github.server_url }}/${{ github.repository }}/compare/${{ inputs.previous-version }}...${{ steps.commit.outputs.short }})

          ${{ inputs.notes }}
        author: GitHub <noreply@github.com>
        base: ${{ github.head_ref || github.ref_name }}
        branch: release
        committer: GitHub <noreply@github.com>
        commit-message: |
          chore(release): ${{ inputs.next-version }}
        delete-branch: true
