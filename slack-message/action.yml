name: Send slack message
description: Sends or updates a Slack notification about release status.

inputs:
  channel-id:
    description: The Slack channel ID to post to
    required: true
  message-id:
    description: Message timestamp to update (for status updates)
    required: false
  status:
    description: "Release status: pending, success, or failure"
    default: "pending"

outputs:
  channel-id:
    description: The channel ID (pass-through)
    value: ${{ inputs.channel-id }}
  message-id:
    description: The message timestamp for subsequent updates
    value: ${{ steps.send_message.outputs.ts }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'

    - run: pip install --require-hashes -r ${{ github.action_path }}/requirements.txt
      shell: bash

    - if: inputs.status == 'pending'
      id: build-images
      run: echo "message=$(python ${{ github.action_path }}/build_message.py)" >> $GITHUB_OUTPUT
      shell: bash
      env:
        MESSAGE_TEMPLATE: images
        SLACK_CHANNEL_ID: ${{ inputs.channel-id }}

    - if: steps.build-images.outputs.message
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
      with:
        method: chat.postMessage
        token: ${{ env.SLACK_BOT_TOKEN }}
        payload: ${{ steps.build-images.outputs.message }}

    - id: build-message
      run: echo "message=$(python ${{ github.action_path }}/build_message.py)" >> $GITHUB_OUTPUT
      shell: bash
      env:
        RELEASE_STATUS: ${{ inputs.status }}
        SLACK_CHANNEL_ID: ${{ inputs.channel-id }}
        SLACK_MESSAGE_TS: ${{ inputs.message-id }}

    - id: send_message
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
      with:
        method: ${{ inputs.message-id && 'chat.update' || 'chat.postMessage' }}
        token: ${{ env.SLACK_BOT_TOKEN }}
        payload: ${{ steps.build-message.outputs.message }}
