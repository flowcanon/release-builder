name: Build changelog
description: Builds a changelog from PRs merged since the last release tag and calculates the next semantic version.

outputs:
  has-prs:
    description: Whether any PRs were found since the last release
    value: ${{ steps.build-changelog.outputs.categorized_prs || steps.build-changelog.outputs.uncategorized_prs }}
  previous-version:
    description: The previous release tag
    value: ${{ steps.build-changelog.outputs.fromTag }}
  next-version:
    description: The calculated next semantic version
    value: ${{ steps.next-version.outputs.version }}
  notes:
    description: The generated changelog notes in markdown
    value: ${{ steps.process-changelog.outputs.changelog }}
  release:
    description: "The release type: major, minor, or patch"
    value: ${{ steps.next-release.outputs.release }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'

    - run: pip install --require-hashes -r ${{ github.action_path }}/requirements.txt
      shell: bash

    - id: build-changelog
      uses: mikepenz/release-changelog-builder-action@bcae7115752d4ed746ff92feb666574428a79415 # v6.2.1
      with:
        configuration: ${{ github.action_path }}/config.json
        outputFile: NEXT.md
        toTag: HEAD

    - id: process-changelog
      run: |
        echo 'changelog<<EOF' >> $GITHUB_OUTPUT
        cat NEXT.md | python ${{ github.action_path }}/process_changelog.py >> $GITHUB_OUTPUT
        echo 'EOF' >> $GITHUB_OUTPUT
      shell: bash

    - id: next-release
      run: |
        echo "release=$(cat NEXT.md | python ${{ github.action_path }}/next_release.py)" >> $GITHUB_OUTPUT
      shell: bash

    - id: next-version
      run: |
        echo "version=$(python ${{ github.action_path }}/next_version.py \
          ${{ steps.build-changelog.outputs.fromTag }} \
          ${{ steps.next-release.outputs.release }})" >> $GITHUB_OUTPUT
      shell: bash
