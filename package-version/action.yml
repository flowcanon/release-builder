name: Set package version
description: Updates the version field in all detected version sources (package.json, pyproject.toml, VERSION file).

inputs:
  version:
    description: The semantic version string to set
    required: true

runs:
  using: "composite"
  steps:
    - id: detect
      run: |
        found=false
        if [ -f package.json ]; then
          echo "has-npm=true" >> $GITHUB_OUTPUT
          found=true
        fi
        if [ -f pyproject.toml ]; then
          echo "has-python=true" >> $GITHUB_OUTPUT
          found=true
        fi
        if [ -f VERSION ]; then
          echo "has-version-file=true" >> $GITHUB_OUTPUT
          found=true
        fi
        if [ "$found" = false ]; then
          echo "::error::No package.json, pyproject.toml, or VERSION file found"
          exit 1
        fi
      shell: bash

    # npm: update package.json and package-lock.json
    - if: steps.detect.outputs.has-npm == 'true'
      uses: jossef/action-set-json-field@890d7642122dbb2833dddd2003659bb71a2b21fe # v2.2
      with:
        file: package.json
        field: version
        value: ${{ inputs.version }}

    - if: steps.detect.outputs.has-npm == 'true'
      uses: jossef/action-set-json-field@890d7642122dbb2833dddd2003659bb71a2b21fe # v2.2
      with:
        file: package-lock.json
        field: version
        value: ${{ inputs.version }}

    - if: steps.detect.outputs.has-npm == 'true'
      uses: jossef/action-set-json-field@890d7642122dbb2833dddd2003659bb71a2b21fe # v2.2
      with:
        file: package-lock.json
        field: packages..version
        value: ${{ inputs.version }}

    - if: steps.detect.outputs.has-npm == 'true'
      run: echo >> package.json && echo >> package-lock.json
      shell: bash

    # Python: update pyproject.toml
    - if: steps.detect.outputs.has-python == 'true'
      env:
        VERSION: ${{ inputs.version }}
      run: |
        python3 -c 'import os,re; v=os.environ["VERSION"]; src=open("pyproject.toml").read(); open("pyproject.toml","w").write(re.sub(r"^version\s*=\s*\".*\"", lambda m: f"version = \"{v}\"", src, count=1, flags=re.M))'
      shell: bash

    # Plain VERSION file
    - if: steps.detect.outputs.has-version-file == 'true'
      env:
        VERSION: ${{ inputs.version }}
      run: printf '%s\n' "$VERSION" > VERSION
      shell: bash
