name: Set package version

inputs:
  version:
    required: true

runs:
  using: "composite"
  steps:
    - id: detect
      run: |
        if [ -f package.json ]; then
          echo "type=npm" >> $GITHUB_OUTPUT
        elif [ -f pyproject.toml ]; then
          echo "type=python" >> $GITHUB_OUTPUT
        elif [ -f VERSION ]; then
          echo "type=version-file" >> $GITHUB_OUTPUT
        else
          echo "::error::No package.json, pyproject.toml, or VERSION file found"
          exit 1
        fi
      shell: bash

    # npm: update package.json and package-lock.json
    - if: steps.detect.outputs.type == 'npm'
      uses: jossef/action-set-json-field@v2
      with:
        file: package.json
        field: version
        value: ${{ inputs.version }}

    - if: steps.detect.outputs.type == 'npm'
      uses: jossef/action-set-json-field@v2
      with:
        file: package-lock.json
        field: version
        value: ${{ inputs.version }}

    - if: steps.detect.outputs.type == 'npm'
      uses: jossef/action-set-json-field@v2
      with:
        file: package-lock.json
        field: packages..version
        value: ${{ inputs.version }}

    - if: steps.detect.outputs.type == 'npm'
      run: echo >> package.json && echo >> package-lock.json
      shell: bash

    # Python: update pyproject.toml
    - if: steps.detect.outputs.type == 'python'
      run: |
        sed -i 's/^version = ".*"/version = "${{ inputs.version }}"/' pyproject.toml
      shell: bash

    # Plain VERSION file
    - if: steps.detect.outputs.type == 'version-file'
      run: echo "${{ inputs.version }}" > VERSION
      shell: bash
